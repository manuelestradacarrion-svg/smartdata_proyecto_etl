name: CI/CD - Smart Data ETL Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validar notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install nbformat
      - name: Validar sintaxis de notebooks
        run: |
          python -c "
          import nbformat,glob,os,sys
          nbs=glob.glob('proceso/*.ipynb')
          print(f'Validando {len(nbs)} notebooks...')
          errors=[]
          for p in nbs:
            try:
              nbformat.read(open(p),4)
              print('OK',os.path.basename(p))
            except Exception as e:
              errors.append(str(e))
          if errors:
            [print('ERROR',e) for e in errors]
            sys.exit(1)
          print('Todos los notebooks son validos')
          "

  run_pipeline:
    name: Ejecutar Job ETL en produccion
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: databricks/setup-cli@main
      - name: Ejecutar job Generacion de Reportes
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Lanzando job en Databricks..."
          databricks jobs run-now --job-id 563928334176336
          echo "Job lanzado exitosamente"
