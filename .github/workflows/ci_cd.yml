name: CI/CD - Smart Data ETL Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validar notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install nbformat
      - name: Validar sintaxis de notebooks
        run: |
          python -c "
          import nbformat,glob,os,sys
          nbs=glob.glob('proceso/*.ipynb')
          print(f'Validando {len(nbs)} notebooks...')
          errors=[]
          for p in nbs:
            try:
              nbformat.read(open(p),4)
              print('OK',os.path.basename(p))
            except Exception as e:
              errors.append(str(e))
          if errors:
            [print('ERROR',e) for e in errors]
            sys.exit(1)
          print('Todos los notebooks son validos')
          "

  run_pipeline:
    name: Ejecutar Job ETL en produccion
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger job Generacion de Reportes
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Iniciando job ETL en Databricks..."
          RESPONSE=$(curl -s -X POST \
            "${DATABRICKS_HOST}/api/2.1/jobs/runs/now" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"job_id": 563928334176336}')
          echo "Respuesta API: $RESPONSE"
          RUN_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['run_id'])")
          echo "Job iniciado - Run ID: $RUN_ID"
          for i in $(seq 1 30); do
            sleep 30
            STATE=$(curl -s "${DATABRICKS_HOST}/api/2.1/jobs/runs/get?run_id=${RUN_ID}" \
              -H "Authorization: Bearer ${DATABRICKS_TOKEN}")
            STATUS=$(echo "$STATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['state']['life_cycle_state'])")
            echo "Estado [$i/30]: $STATUS"
            if [ "$STATUS" = "TERMINATED" ] || [ "$STATUS" = "INTERNAL_ERROR" ]; then
              RESULT=$(echo "$STATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['state']['result_state'])")
              echo "Resultado: $RESULT"
              if [ "$RESULT" = "SUCCESS" ]; then echo "Pipeline exitoso"; exit 0
              else echo "Pipeline fallo: $RESULT"; exit 1; fi
            fi
          done
          echo "Timeout superado"; exit 1
